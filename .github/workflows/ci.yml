name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Runs the full gate: tokens:build → typecheck → lint → test → build-storybook.
      # The same command runs locally via `npm run check`, so CI and local never drift.
      - run: npm run check
