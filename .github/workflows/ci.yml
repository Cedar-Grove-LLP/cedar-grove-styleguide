name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this job only reads the repo — it never writes commits,
# comments, or releases.
permissions:
  contents: read

# A new push to the same branch supersedes the run in flight, so rapid pushes
# don't queue up redundant full builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Runs the full gate: tokens:build → typecheck → lint → test → build-storybook.
      # The same command runs locally via `npm run check`, so CI and local never drift.
      - run: npm run check
